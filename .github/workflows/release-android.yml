# Builds the signed Android artifacts for a release:
#   - an APK, attached to the GitHub Release (direct download / sideload)
#   - an AAB, uploaded as a workflow artifact (this is what Google Play takes;
#     Play rejects APKs, and the bundle isn't useful to sideloaders, so it stays
#     off the public release page)
#
# Both come out of a single Gradle invocation, so the AAB is close to free.
#
# One-time setup — generate a keystore and add these repo secrets
# (Settings → Secrets and variables → Actions):
#   keytool -genkeypair -v -keystore solitaire-release.keystore \
#     -alias solitaire -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 solitaire-release.keystore   # value for ANDROID_KEYSTORE_BASE64
#
#   ANDROID_KEYSTORE_BASE64    base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias (e.g. solitaire)
#   ANDROID_KEY_PASSWORD       key password
#
# On Play this keystore is the *upload* key: Play re-signs the bundle with its
# own app-signing key before shipping it. It must stay the key registered with
# Play App Signing, or the upload is rejected.
name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build the APK and AAB from
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          # Don't leave the write-scoped token in .git/config for later steps
          # (npm install scripts, Gradle plugins) to read. The upload step
          # below gets it explicitly through GH_TOKEN.
          persist-credentials: false

      - name: Resolve tag and version numbers
        id: ver
        env:
          # Passed through the environment, never interpolated into the script:
          # a tag name or dispatch input is attacker-influenced text, and
          # `${{ }}` inside `run:` would paste it in as shell source.
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag provided" >&2; exit 1; fi
          # Strict allow-list before the value reaches shell arithmetic (which
          # evaluates expressions) or $GITHUB_OUTPUT (which is line-oriented).
          if ! [[ "$TAG" =~ ^v?[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Tag '$TAG' is not numeric semver (vMAJOR.MINOR.PATCH)" >&2; exit 1
          fi
          VERSION_NAME="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))
          if [ "$VERSION_CODE" -le 0 ]; then
            echo "Tag '$TAG' is not numeric semver (vMAJOR.MINOR.PATCH)" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Collect artifacts
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/solitaire-$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "out/solitaire-$VERSION_NAME.aab"

      - name: Verify artifacts are signed
        run: |
          for f in out/*.apk out/*.aab; do
            # minSdk is 23, so AGP applies the v1 (JAR) signature to the APK, and
            # bundles are always jarsigned — a cert in either confirms the release
            # keystore was applied rather than a debug fallback.
            unzip -l "$f" | grep -qE 'META-INF/.*\.(RSA|EC)' \
              || { echo "ERROR: $f is unsigned — release keystore secrets missing?"; exit 1; }
            echo "$f is signed"
          done

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          # Needed now that checkout no longer persists credentials for gh to
          # infer the repository from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          gh release upload "$TAG" "out/solitaire-$VERSION_NAME.apk" --clobber

      - name: Upload AAB for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: solitaire-${{ steps.ver.outputs.name }}-playstore-aab
          path: out/solitaire-${{ steps.ver.outputs.name }}.aab
          if-no-files-found: error
          retention-days: 90
